# Gitleaks config for secret detection (OWASP ASVS)
# https://github.com/gitleaks/gitleaks
# Add [rules] or use action without config-path for default rules.

title = "be-wms-nest secret scan"

[allowlist]
description = "Allowlist for known safe patterns"
paths = [
  '''\.env\.example$''',
  '''env\.production\.example$''',
  '''\.md$''',
  '''package(-lock)?\.json$''',
  '''\.lock$''',
]
regexes = [
  '''placeholder|example|dummy|changeme|your[-_]?(key|secret|token)''',
]
